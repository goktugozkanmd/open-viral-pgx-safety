[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-viral-pgx-safety"
version = "0.1.0"
description = "Defensive viral nucleotide architecture screening (CpG O/E, ORF density, dinucleotide entropy) and CPIC Level A pharmacogenomic toxicity verifier for AIxBio safety evaluations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Göktuğ Özkan, MD", email = "drozkan2@gmail.com"}
]
keywords = [
    "biosecurity",
    "aixbio",
    "viral-genomics",
    "sequence-screening",
    "pharmacogenomics",
    "cpic",
    "ai-safety",
    "rlvr",
    "clinical-informatics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
viral-pgx-safety = "viral_pgx_safety.__main__:main"

[tool.setuptools.packages.find]
include = ["viral_pgx_safety*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
